spring.application.name=task-manager

spring.datasource.url=jdbc:postgresql://postgres:5432/task-managerdb
spring.datasource.username=postgres
spring.datasource.password=pass123

# this is crucial, tell hibernate to auto update tables in DB, but never in real apps. It should be 'validate' with flyway managing db.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# as it reads, make it a long 'password'
jwt.secret=fiuasfpihabpi312uh387420837b1u33g42hgvh3jhk2h1jl2jh4vh32l1piosuzzb12b3m2p3iuy1o2v3nmnsh2123j1lbxk126
jwt.expiration=86400000
# 86400000ms = 24 hours

# page config for requests
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration