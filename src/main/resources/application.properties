spring.application.name=task-manager

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=senha123

# this is crucial, tell hibernate to auto update tables in DB, but never in real apps. It should be 'validate', get to know about flyway afterward.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# as it reads, make it a long 'password'
jwt.secret=your-256-bit-secret-here-make-it-long-and-random-please
jwt.expiration=86400000
# 86400000ms = 24 hours

# page config for requests
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20