spring.application.name=task-manager

spring.datasource.url=jdbc:postgresql://postgres:5432/task-managerdb
spring.datasource.username=postgres
spring.datasource.password=pass123

# this is crucial, tell hibernate to auto update tables in DB, but never in real apps. It should be 'validate' with flyway managing db.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# deal with this later, during continuous deployment
jwt.secret=dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHkxMjM0NTY3ODk=
jwt.expiration=86400000
# 86400000ms = 24 hours

# page config for requests
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration