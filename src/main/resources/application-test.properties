# ============================================================
# STEP 1 — Test datasource override
# Place this file at: src/test/resources/application-test.properties
#
# This file activates when @ActiveProfiles("test") is present.
# It swaps Postgres for H2 (in-memory) and disables Flyway,
# so your tests don't need a running database container.
# ============================================================

# use H2 in-memory database instead of Postgres (it's a shortcut, normally you'd have testcontainers with PostgreSQL on docker.)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=test
spring.datasource.password=1234

# let hibernate build the schema from entities (test only)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# disable flyway — h2 doesn't need migration scripts
spring.flyway.enabled=false

# static JWT secret for tests
jwt.secret=dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHkxMjM0NTY3ODk=
jwt.expiration=86400000