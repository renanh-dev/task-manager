services:
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9411/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    ports:
      - "5432:5432"
    image: postgres:16
    container_name: postgresdb
    environment:
      POSTGRES_DB: task-managerdb
      POSTGRES_USER: task-manager-postgresql-db
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U task-manager-postgresql-db -d task-managerdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # ACTIVE PROFILE
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      # DB CONFIG
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task-managerdb
      SPRING_DATASOURCE_USERNAME: task-manager-postgresql-db
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # JWT CONFIG
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      # ADMIN CREDENTIALS
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_BCRYPT: ${ADMIN_PASSWORD_BCRYPT}
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy

volumes:
  postgres_data: