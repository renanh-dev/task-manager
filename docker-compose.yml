services:
  postgres:
    image: postgres:16
    container_name: postgresdb
    environment:
      POSTGRES_DB: task-managerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .                  # builds from Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task-managerdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: pass123
    depends_on:
      - postgres              # waits for postgres to start first

volumes:
  postgres_data: